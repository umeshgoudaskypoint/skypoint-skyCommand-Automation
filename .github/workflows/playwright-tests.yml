name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekdays at 06:00 UTC
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which tests to run'
        required: true
        default: 'sanity'
        type: choice
        options: [all, sanity, auth]

jobs:
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          CI: true
          BASE_URL: https://qa-skycommand.skypoint.ai
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          # No credentials configured yet - run only the logged-out tests.
          SKIP_AUTH: ${{ secrets.TEST_USER_PASSWORD == '' && 'true' || 'false' }}
        run: |
          case "${{ github.event.inputs.suite || 'all' }}" in
            sanity) npx playwright test --grep @sanity ;;
            auth)   npx playwright test tests/authentication.spec.ts ;;
            *)      npx playwright test ;;
          esac

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: test-results/
          retention-days: 7
